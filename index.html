<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga Reader</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101015;
      color: #f4f4f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .app {
      width: min(900px, 100%);
      background: #1a1a22;
      border: 1px solid #2f2f3a;
      border-radius: 12px;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }
    input[type="file"] { max-width: 100%; }
    .counter { color: #d4d4dc; }
    .viewer {
      width: 100%;
      min-height: 300px;
      border: 1px dashed #4d4d5e;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #111118;
      overflow: hidden;
    }
    .viewer img {
      width: 100%;
      height: auto;
      object-fit: contain;
      max-height: 75vh;
    }
    .empty {
      color: #b5b5c6;
      text-align: center;
      padding: 1rem;
    }
    .controls {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }
    button {
      border: 1px solid #3d3d4f;
      border-radius: 6px;
      background: #242433;
      color: #f4f4f5;
      padding: 0.6rem 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Manga Reader</h1>
    <p>Upload comic image pages and read them directly in your browser.</p>

    <div class="toolbar">
      <label>
        <span>Upload pages: </span>
        <input id="fileInput" type="file" accept="image/*" multiple />
      </label>
      <span id="counter" class="counter">No pages loaded</span>
    </div>

    <section class="viewer" aria-live="polite" aria-label="Manga page viewer">
      <div id="emptyState" class="empty">Choose one or more comic image files to start reading.</div>
      <img id="pageImage" alt="Current manga page" hidden />
    </section>

    <div class="controls">
      <button id="prevBtn" disabled>Previous</button>
      <button id="nextBtn" disabled>Next</button>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const pageImage = document.getElementById('pageImage');
    const emptyState = document.getElementById('emptyState');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let pages = [];
    let currentIndex = -1;

    const updateUI = (message) => {
      const hasPages = pages.length > 0;

      if (!hasPages) {
        emptyState.hidden = false;
        pageImage.hidden = true;
        counter.textContent = message || 'No pages loaded';
      } else {
        emptyState.hidden = true;
        pageImage.hidden = false;
        pageImage.src = pages[currentIndex];
        counter.textContent = `Page ${currentIndex + 1} of ${pages.length}`;
      }

      prevBtn.disabled = !hasPages || currentIndex <= 0;
      nextBtn.disabled = !hasPages || currentIndex >= pages.length - 1;
    };

    const resetPages = () => {
      pages.forEach((url) => URL.revokeObjectURL(url));
      pages = [];
      currentIndex = -1;
      updateUI();
    };

    fileInput.addEventListener('change', (event) => {
      resetPages();

      const selectedFiles = Array.from(event.target.files || []);
      const files = selectedFiles.filter((file) => file.type.startsWith('image/'));
      if (files.length === 0) {
        const message = selectedFiles.length > 0 ? 'No valid image files selected' : 'No pages loaded';
        updateUI(message);
        return;
      }

      pages = files.map((file) => URL.createObjectURL(file));
      currentIndex = 0;
      updateUI();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        updateUI();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < pages.length - 1) {
        currentIndex += 1;
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
